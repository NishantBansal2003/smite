[package]
name = "ldk-node-wrapper"
version = "0.0.0"
edition = "2024"

[profile.release]
# Skip stack unwinding on panics so that the crash handler has time to report
# the crash before the snapshot gets reset.
panic = "abort"

[dependencies]
ldk-node = { git = "https://github.com/lightningdevkit/ldk-node", rev = "9e1d297f26f0c34f0bb82c872fd75e82d9a40df7" }
libc = "0.2"

[lints]
workspace = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"
